# cargo nextest: every test in one pool across the workspace's test binaries.
[profile.default]
# Each test takes RAYON_NUM_THREADS threads of its own: a few tests at once keep the machine's
# memory and cores from being oversubscribed.
test-threads = 8
slow-timeout = { period = "60s" }

[test-groups]
# CubeCL's CPU runtime threads each launch across every core: two at once slow both several
# times over.
cubecl = { max-threads = 1 }

[[profile.default.overrides]]
filter = "package(emcraft-gpu)"
test-group = "cubecl"

# The heavy tests (cargo xtask test --heavy, the CI's heavy job) factor large systems: a CI runner
# (16 GB, 4 cores) holds two of them at a time, and the solved templates' tour (a radiation solve
# of 7 GB) only alone. Eight at once had the factorizations refuse for want of memory.
[profile.heavy]
test-threads = 2
slow-timeout = { period = "300s" }

[[profile.heavy.overrides]]
filter = "package(emcraft-gpu)"
test-group = "cubecl"

[[profile.heavy.overrides]]
filter = "test(every_solved_template_opens_with_its_results)"
threads-required = "num-test-threads"
