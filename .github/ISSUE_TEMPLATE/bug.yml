name: Bug report
description: Something EMCraft does wrong, a wrong result, or a crash
labels: [bug]
body:
  - type: textarea
    id: observed
    attributes:
      label: Observed failure
      description: Exactly what happened. Quote error messages and wrong numbers as they appear.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Numbered steps, or a script (`emcraft-cli run script.json`, control-channel JSON lines), with the sample, template or attached `.emcraft` / `.solidcraft` file that shows it.
      placeholder: |
        1. emcraft --sample highpass
        2. Solve ▸ Frequency ▸ 6–9 GHz
        3. ...
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: |
        Pictures first: for anything you can see (the view, a mesh, a field picture, a chart), drag a screenshot or a short screen recording in here and mark the problem on it. Then log output and numbers.
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: What should happen instead, and why — a closed form, a published benchmark, a measurement, the documentation, or how the rest of the app behaves. Never output from a commercial EM tool.
    validations:
      required: true
  - type: textarea
    id: investigation
    attributes:
      label: Investigation
      description: Anything you found about the cause — code you suspect, what you ruled out. Leave empty if you have not looked.
  - type: input
    id: version
    attributes:
      label: Version and platform
      placeholder: "v0.1.0 (or commit), Ubuntu 24.04 x86_64"
    validations:
      required: true
