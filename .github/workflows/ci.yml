name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# A newer push to a pull request makes its running checks moot; a push to a branch does not
# cancel the run in progress, only the run waiting behind it is replaced by the newest. The heavy
# tests run apart (heavy.yml), so a gate never waits behind them.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # The GPU crate links CubeCL's LLVM into every test binary: without debug information they
  # still fill a runner's disk unless it is cleared first.
  CARGO_PROFILE_RELEASE_DEBUG: "false"
  CARGO_PROFILE_RELEASE_STRIP: "debuginfo"
  # The shipped binaries' whole-program optimisation (Cargo.toml) would link each of the dozens
  # of test binaries in one slow thread: the tests build with thin LTO in 16 units instead. The
  # results are the same bit for bit (the oracle's fixtures, blessed under both, are identical).
  CARGO_PROFILE_RELEASE_LTO: "thin"
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"

jobs:
  bots:
    name: Claim and triage bot tests
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts
      # scripts/claim and scripts/triage run in claim.yml and triage.yml through
      # actions/github-script; their tests use only node:test against a fake client.
      - run: node --test scripts/claim/*.test.js scripts/triage/*.test.js

  gate:
    # A draft starts no run; marking it ready for review does.
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    steps:
      - name: Free the runner's disk
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost && df -h /
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        id: toolchain
        with:
          components: rustfmt, clippy
      # Compiled dependencies (and the git ones' checkouts), keyed on Cargo.lock, the toolchain and
      # the job. Saved from main only, so branches restore main's and do not crowd it out of the
      # repository's 10 GB; saved when a test fails too, as the build itself was good.
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      - name: System libraries for the desktop app
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libgl1-mesa-dev
      - run: cargo fmt --all --check
      - run: cargo xtask layers
      - run: cargo xtask dupes --fail
      - run: cargo xtask colours
      - run: cargo xtask style
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      # In release, sharing the build with the oracle below (debug assertions are left to local
      # runs); every test in one pool (.config/nextest.toml), then the doctests.
      - run: cargo xtask test --release
      # The oracle's results are deterministic bit for bit (AGENTS.md): a pass with the same
      # inputs proves the same results. The key hashes every crate the oracle binary is built
      # from, the cases and the lock file, with the compiler's version; a change to the UI, the
      # apps or the docs keeps it and skips the run.
      - name: Oracle inputs
        id: oracle-key
        run: echo "key=oracle-pass-${{ steps.toolchain.outputs.cachekey }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'tests/oracle/**', 'crates/model/**', 'crates/mesh/**', 'crates/tetmesh/**', 'crates/fem/**', 'crates/theory/**', 'crates/solver/**', 'crates/fdtd/**', 'crates/gpu/**', 'crates/io/**', 'crates/render/**', 'crates/engine/**', 'crates/testkit/**') }}" >> "$GITHUB_OUTPUT"
      - name: Oracle passed before with these inputs
        id: oracle-cache
        uses: actions/cache/restore@v4
        with:
          path: .oracle-pass
          key: ${{ steps.oracle-key.outputs.key }}
      - name: Oracle
        if: steps.oracle-cache.outputs.cache-hit != 'true'
        run: cargo run --release -p emcraft-testkit --bin oracle -- --no-write
      - name: Record the pass
        if: steps.oracle-cache.outputs.cache-hit != 'true'
        run: git rev-parse HEAD > .oracle-pass
      - uses: actions/cache/save@v4
        if: steps.oracle-cache.outputs.cache-hit != 'true'
        with:
          path: .oracle-pass
          key: ${{ steps.oracle-key.outputs.key }}
