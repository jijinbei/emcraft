# Monthly dependency updates against develop, the trunk, grouped and few at a time so they leave
# room on the runners for contributors' pull requests. Security updates are switched on in the repository settings and open their own
# pull requests as advisories appear. CI runs the gate on Dependabot's pull requests.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    target-branch: develop
    schedule:
      interval: monthly
      time: "05:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 2
    commit-message:
      prefix: deps
    groups:
      # Compatible updates (Cargo.lock only) in one pull request; a breaking release of a
      # dependency comes on its own, since it usually needs code changes.
      cargo-compatible:
        update-types: [minor, patch]
    ignore:
      # Pinned to the SolidCraft commit EMCraft reads designs with
      # (docs/adr/0003-solidcraft-exchange.md); moved by hand.
      - dependency-name: "solidcraft-*"
      # The exact predicates' BigInt must be num-rational's (0.4 uses num-bigint 0.4): both move
      # together, by hand.
      - dependency-name: num-bigint
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: num-rational
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: monthly
      time: "05:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 1
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]
